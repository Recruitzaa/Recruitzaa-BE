name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy application
        run: |
          cd ~/Recruitzaa-BE
          chmod +x start_recruitzaa.sh
          ./start_recruitzaa.sh
