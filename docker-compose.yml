# docker-compose.yml — Recruitzaa dev infrastructure
# ============================================================
# Recruitzaa — Dev Infrastructure
# Ports (standard — trading system stopped):
#   PostgreSQL : 5432
#   MongoDB    : 27017
#   Redis      : 6379
#   Kafka      : 9092  (KRaft, no Zookeeper)
#   MinIO      : 9000 (API) / 9001 (Console)
#   Kafka-UI   : 8085
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  recruitzaa-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  minio_data:
  pgadmin_data:

services:

  # ──────────────────────────────────────────
  # PostgreSQL 15
  # ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: recruitzaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruitzaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitzaa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-recruitzaa}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitzaa} -d ${POSTGRES_DB:-recruitzaa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────
  # MongoDB 7
  # ──────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: recruitzaa-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-recruitzaa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-recruitzaa}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: recruitzaa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────
  # Kafka 7.5 — KRaft mode (no Zookeeper)
  # ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recruitzaa-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # ──────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: recruitzaa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────
  # Kafka UI (dev convenience)
  # ──────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: recruitzaa-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: recruitzaa-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    networks:
      - recruitzaa-net
    logging: *default-logging

  # ──────────────────────────────────────────
  # Auth Service — Phase 1
  # ──────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: recruitzaa-auth
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      MONGODB_URL: mongodb://${MONGO_USER:-recruitzaa}:${MONGO_PASSWORD:-mongo_secret}@mongo:27017/${MONGO_DB:-recruitzaa}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8001"
    volumes:
      - ./secrets:/app/secrets:ro
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────
  # Core API Service — Phase 2a
  # ──────────────────────────────────────────
  core-api:
    build:
      context: .
      dockerfile: services/core_api_service/Dockerfile
    container_name: recruitzaa-core-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: .env
    environment:
      MONGODB_URL: mongodb://${MONGO_USER:-recruitzaa}:${MONGO_PASSWORD:-mongo_secret}@mongo:27017/${MONGO_DB:-recruitzaa}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8002"
    volumes:
      - ./services/core_api_service:/app/services/core_api_service
      - ./shared:/app/shared
      - ./secrets:/app/secrets:ro
    networks:
      - recruitzaa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────
  # pgAdmin — PostgreSQL GUI
  # URL: http://localhost:5050 / pgadmin-recruitzaa.sharatpatnayakuni.site
  # Login: admin@recruitzaa.dev / pgadmin_secret
  # ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: recruitzaa-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@recruitzaa.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_secret}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - recruitzaa-net
    logging: *default-logging

  # ──────────────────────────────────────────
  # Mongo Express — MongoDB GUI
  # URL: http://localhost:8081 / mongo-recruitzaa.sharatpatnayakuni.site
  # Login: admin / mexpress_secret
  # ──────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: recruitzaa-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-recruitzaa}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-mongo_secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-recruitzaa}:${MONGO_PASSWORD:-mongo_secret}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MEXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MEXPRESS_PASSWORD:-mexpress_secret}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8081:8081"
    networks:
      - recruitzaa-net
    logging: *default-logging
