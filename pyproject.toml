[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # bugbear (common bugs/design issues)
    "UP", # pyupgrade (modern Python syntax)
]
ignore = [
    # Depends()/Query() in argument defaults is the intended FastAPI idiom.
    "B008",
    # StrEnum would drop the str mixin that CamelModel's use_enum_values relies on.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "services", "shared"]
