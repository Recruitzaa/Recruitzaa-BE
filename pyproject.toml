[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # bugbear (common bugs/design issues)
    "UP", # pyupgrade (modern Python syntax)
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
